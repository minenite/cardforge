modLoader = "javafml"
loaderVersion = "[4,)"
license = "GPL-3.0 (inherited from Paper via Cardboard)"
issueTrackerURL = "https://github.com/minenite/cardforge/issues"

[[mods]]
modId = "cardforge"
version = "26.2"
displayName = "Cardforge"
authors = "MineNite, and the Cardboard contributors"
description = '''
Runs Bukkit/Spigot/Paper plugins on NeoForge by reusing Cardboard's Bukkit
compatibility implementation.
'''
# CardForge is a server-side compatibility layer; a client has no use for it and
# must not be required to install it. Without this, NeoForge defaults to
# MATCH_VERSION and the handshake rejects any client that does not have CardForge
# at the same version, which is every ordinary client.
displayTest = "IGNORE_SERVER_VERSION"

[[dependencies.cardforge]]
modId = "neoforge"
type = "required"
versionRange = "[26.2,)"
ordering = "NONE"
side = "SERVER"

[[dependencies.cardforge]]
modId = "minecraft"
type = "required"
versionRange = "[26.2,)"
ordering = "NONE"
side = "SERVER"

[[mixins]]
config = "bukkitfabric.mixins.json"

[[mixins]]
config = "cardforge.mixins.json"

# iCommonLib's mixins. Cardboard bundles iCommonLib's classes but on Fabric relies
# on iCommonLib being installed as a separate mod to register them. CardForge
# bundles the code, so it has to register them too - without this, IMixinEntity is
# never applied to Entity and every cast to it throws ClassCastException, which is
# what broke launchProjectile, Entity#remove and keyed boss bars.
[[mixins]]
config = "icommon.mixins.json"
