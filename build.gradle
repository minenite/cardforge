plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

group = project.mod_group
version = project.mod_version
base { archivesName = project.mod_name }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

repositories {
    mavenCentral()
    maven { name = 'PaperMC'; url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
    maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/maven' }
    maven { name = 'Izzel'; url = 'https://maven.izzel.io/releases' }
}

neoForge {
    version = project.neoforge_version

    // Cardboard's access widener, converted by tools/aw2at.py
    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        server {
            server()
            gameDirectory = file('run')
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // The Bukkit/Paper API surface Cardboard implements.
    implementation "io.papermc.paper:paper-api:${project.paper_api_version}"
    implementation "net.kyori:adventure-api:${project.adventure_version}"
    implementation "net.kyori:adventure-text-serializer-gson:${project.adventure_version}"
    implementation "net.kyori:adventure-text-serializer-legacy:${project.adventure_version}"
    implementation "net.kyori:adventure-text-serializer-plain:${project.adventure_version}"
    implementation "net.kyori:adventure-text-minimessage:${project.adventure_version}"

    implementation 'net.md-5:bungeecord-chat:1.21-R0.2'
    implementation 'org.yaml:snakeyaml:1.33'
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    implementation 'commons-lang:commons-lang:2.6'
    implementation 'io.leangen.geantyref:geantyref:1.3.16'
    implementation 'net.md-5:SpecialSource:1.11.2'
    implementation 'net.fabricmc:mapping-io:0.8.0'
    implementation 'org.spongepowered:configurate-core:4.2.0'
    implementation 'org.spongepowered:configurate-hocon:4.2.0'
    implementation 'org.spongepowered:configurate-yaml:4.2.0'
    implementation 'org.apache.maven.resolver:maven-resolver-supplier:1.9.18'
    implementation 'io.izzel:tools:1.3.0'

    implementation files('libs/CardboardMohistRemapper-0.4.jar')

    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.6'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.compilerArgs << '-Xmaxerrs' << '20000'
    options.failOnError = true
    options.encoding = 'UTF-8'
}
