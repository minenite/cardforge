plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

group = project.mod_group
version = project.mod_version
base { archivesName = project.mod_name }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

// Cardboard mixes into Bukkit/Paper API classes (SimplePluginManager,
// RegisteredListener, InternalAPIBridge...). On Fabric it appended paper-api to
// the launcher classpath at runtime; NeoForge has no such hook, so the API has
// to be on the mod's own classpath from the start. Bundle it into the jar.
configurations {
    bundled
    implementation.extendsFrom(bundled)
}

repositories {
    mavenCentral()
    maven { name = 'PaperMC'; url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
    maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/maven' }
    maven { name = 'Izzel'; url = 'https://maven.izzel.io/releases' }
}

neoForge {
    version = project.neoforge_version

    // Cardboard's access widener, converted by tools/aw2at.py
    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        server {
            server()
            gameDirectory = file('run')
        }
    }

    mods {
        cardforge {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // The Bukkit/Paper API surface Cardboard implements.
    bundled "io.papermc.paper:paper-api:${project.paper_api_version}"
    bundled "net.kyori:adventure-api:${project.adventure_version}"
    bundled "net.kyori:adventure-text-serializer-gson:${project.adventure_version}"
    bundled "net.kyori:adventure-text-serializer-legacy:${project.adventure_version}"
    bundled "net.kyori:adventure-text-serializer-plain:${project.adventure_version}"
    bundled "net.kyori:adventure-text-minimessage:${project.adventure_version}"

    bundled 'net.md-5:bungeecord-chat:1.21-R0.2'
    bundled 'org.yaml:snakeyaml:1.33'
    bundled 'com.googlecode.json-simple:json-simple:1.1.1'
    bundled 'commons-lang:commons-lang:2.6'
    bundled 'io.leangen.geantyref:geantyref:1.3.16'
    bundled 'net.md-5:SpecialSource:1.11.2'
    bundled 'net.fabricmc:mapping-io:0.8.0'
    bundled 'org.spongepowered:configurate-core:4.2.0'
    bundled 'org.spongepowered:configurate-hocon:4.2.0'
    bundled 'org.spongepowered:configurate-yaml:4.2.0'
    bundled 'org.apache.maven.resolver:maven-resolver-supplier:1.9.18'
    bundled 'io.izzel:tools:1.3.0'

    bundled files('libs/CardboardMohistRemapper-0.4.jar')

    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.6'
    // Provided by NeoForge at runtime and excluded from our jar, so compile
    // against it only. Used by MaterialValuesRewriter.
    compileOnly 'org.ow2.asm:asm:9.10.1'
}

tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.bundled.collect { it.isDirectory() ? it : zipTree(it) }
    }
    // NeoForge already provides these on the boot layer; shipping a second copy
    // causes 'loader constraint violation' LinkageErrors across class loaders.
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/versions/**'
    exclude 'org/slf4j/**', 'org/apache/logging/**', 'com/mojang/logging/**'
    exclude 'com/google/gson/**', 'com/mojang/brigadier/**', 'com/mojang/datafixers/**'
    exclude 'com/mojang/serialization/**', 'com/mojang/authlib/**', 'it/unimi/dsi/**'
    exclude 'com/google/common/**', 'org/joml/**', 'io/netty/**'
    exclude 'org/objectweb/asm/**', 'org/apache/commons/logging/**'
    // Maven needs splitting rather than excluding wholesale. NeoForge ships exactly
    // one Maven artifact, maven-artifact, and IModInfo#getVersion returns its
    // ArtifactVersion, so a second copy here is a loader constraint violation.
    // But it ships neither the resolver (org/eclipse/aether) nor javax/inject, and
    // Paper's LibraryLoader needs both to resolve the `libraries:` block in
    // plugin.yml. Excluding all of org/apache/maven took the resolver with it and
    // broke provider discovery with ClassNotFoundException on
    // org.eclipse.aether.RepositorySystemSession - which surfaced only as
    // "Initialized 0 plugins", a server that boots clean while silently running
    // none of the operator's plugins.
    // So exclude just what maven-artifact owns, and keep repository/internal, which
    // belongs to maven-resolver-provider and carries MavenRepositorySystemUtils.
    exclude 'org/apache/maven/artifact/**'
    exclude 'org/apache/maven/repository/*'
    exclude 'org/apache/maven/repository/legacy/**'
    // Found by tools/check_class_overlap.py, which diffs this jar against every
    // NeoForge library. joptsimple matters most: CardforgeOptionParser extends
    // OptionParser and hands the resulting OptionSet to code on the other loader.
    exclude 'joptsimple/**'
    exclude 'org/codehaus/plexus/util/**'
    exclude 'org/jspecify/**', 'com/google/j2objc/**'
    exclude 'com/google/thirdparty/**'          // guava's publicsuffix tables
    exclude 'org/apache/commons/lang3/**', 'org/apache/commons/io/**'
    exclude 'org/apache/commons/collections4/**', 'com/google/errorprone/**'
    exclude 'META-INF/services/org.apache.commons.logging.LogFactory'
    exclude 'module-info.class'
    // Service files naming excluded classes make the jar an invalid module.
    exclude 'META-INF/services/org.apache.logging.**'
    exclude 'META-INF/services/javax.annotation.processing.Processor'
    exclude 'META-INF/services/com.mojang.**'
    exclude 'META-INF/log4j-provider.properties', 'Log4j2Plugins.dat'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.compilerArgs << '-Xmaxerrs' << '20000'
    options.failOnError = true
    options.encoding = 'UTF-8'
}

// A slim artifact carrying only the integration API, for CardForge-native plugins
// to compile against. The full mod jar cannot serve that purpose: it bundles
// Cardboard's own implementations of Bukkit types, including JavaPlugin, which
// shadow paper-api's on a plugin's compile classpath and fail to compile against
// the current Plugin interface. Plugin authors want the interfaces and nothing else.
tasks.register('apiJar', Jar) {
    archiveBaseName = 'Cardforge-API'
    from(sourceSets.main.output) {
        include 'org/minenite/cardforge/api/**'
    }
    // The impl package is deliberately excluded: it is reachable at runtime through
    // CardForge.get(), and nothing should be compiling against it.
    exclude 'org/minenite/cardforge/api/impl/**'
}

tasks.named('build') { dependsOn 'apiJar' }
